# 全栈一键启动：docker compose up -d --build
services:
  # PostgreSQL + pgvector：业务数据与 RAG 向量数据
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ai-interviewer-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ai_interviewer
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis：缓存 + Redis Stream 异步任务队列
  redis:
    image: redis:7
    container_name: ai-interviewer-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # MinIO：S3 兼容对象存储，存放简历、头像与知识库文档
  minio:
    image: minio/minio
    container_name: ai-interviewer-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # 控制台
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 5

  # 一次性任务：创建应用所需的 bucket 并设为公开读
  createbuckets:
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      set -eu;
      /usr/bin/mc alias set myminio http://minio:9000 minioadmin minioadmin &&
      (
        /usr/bin/mc ls myminio/ai-interviewer > /dev/null 2>&1 ||
        /usr/bin/mc mb myminio/ai-interviewer
      ) &&
      /usr/bin/mc anonymous set public myminio/ai-interviewer &&
      /usr/bin/mc ls myminio/ai-interviewer
      "

  # 后端：Spring Boot API
  app:
    build:
      context: .
      dockerfile: app/Dockerfile
    container_name: ai-interviewer-app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      createbuckets:
        condition: service_completed_successfully
    environment:
      # 数据库
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ai_interviewer
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # 对象存储（容器内走服务名访问）
      APP_STORAGE_ENDPOINT: http://minio:9000
      APP_STORAGE_ACCESS_KEY: minioadmin
      APP_STORAGE_SECRET_KEY: minioadmin
      APP_STORAGE_BUCKET: ai-interviewer
      APP_STORAGE_REGION: us-east-1
      # AI 模型（取自宿主机环境变量或 .env）
      AI_BAILIAN_API_KEY: ${AI_BAILIAN_API_KEY}
      AI_MODEL: ${AI_MODEL:-qwen3.8-flash}
      APP_AI_CONFIG_ENCRYPTION_KEY: ${APP_AI_CONFIG_ENCRYPTION_KEY}
      # 面试参数
      APP_INTERVIEW_FOLLOW_UP_COUNT: ${APP_INTERVIEW_FOLLOW_UP_COUNT:-1}
      APP_INTERVIEW_EVALUATION_BATCH_SIZE: ${APP_INTERVIEW_EVALUATION_BATCH_SIZE:-8}
      # 浏览器来源白名单：改了 FRONTEND_PORT 必须同步，否则语音面试 WebSocket 的 Origin 校验会拒绝
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost,http://localhost:80,http://localhost:5173,http://localhost:5174,http://127.0.0.1:5173,http://127.0.0.1:5174}
    ports:
      - "${BACKEND_PORT:-8080}:8080"

  # 前端：React 静态站点 + Nginx 反向代理
  frontend:
    build: ./frontend
    container_name: ai-interviewer-frontend
    depends_on:
      - app
    ports:
      - "${FRONTEND_PORT:-80}:80"

volumes:
  postgres_data:
  redis_data:
  minio_data: